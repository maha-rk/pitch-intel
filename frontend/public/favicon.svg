<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background circle -->
  <circle cx="16" cy="16" r="16" fill="#0B1929"/>
  <!-- Green pitch rectangle -->
  <rect x="6" y="9" width="20" height="14" rx="1.5" fill="#166534"/>
  <!-- Pitch markings: center line -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#22C55E" stroke-width="0.7" opacity="0.7"/>
  <!-- Center circle -->
  <circle cx="16" cy="16" r="3.2" fill="none" stroke="#22C55E" stroke-width="0.7" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="0.8" fill="#22C55E"/>
  <!-- Left penalty box -->
  <rect x="6" y="11.5" width="4.5" height="9" fill="none" stroke="#22C55E" stroke-width="0.6" opacity="0.6"/>
  <!-- Right penalty box -->
  <rect x="21.5" y="11.5" width="4.5" height="9" fill="none" stroke="#22C55E" stroke-width="0.6" opacity="0.6"/>
</svg>
