name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest statsbombpy pandas numpy openai python-dotenv requests faiss-cpu sentence-transformers ibm-watsonx-ai

      - name: Run tests
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: test-stub-key
          GROQ_MODEL: llama-3.3-70b-versatile
          WATSONX_API_KEY: ""
          WATSONX_PROJECT_ID: ""
        run: |
          python -m pytest tests/test_monte_carlo.py tests/test_pitch_agent.py -v --tb=short
